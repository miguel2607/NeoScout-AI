<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="320" y2="200">
      <stop stop-color="#0d1528"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a1620"/>
    </linearGradient>
    <radialGradient id="p1-rim" cx="85%" cy="15%" r="55%">
      <stop stop-color="#00ffa3" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p1-skin" x1="120" y1="55" x2="200" y2="165">
      <stop stop-color="#d4a574"/>
      <stop offset="1" stop-color="#b8895c"/>
    </linearGradient>
    <filter id="p1-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="200" fill="url(#p1-bg)"/>
  <rect width="320" height="200" fill="url(#p1-rim)"/>
  <!-- hombros / camiseta -->
  <path d="M40 200 L40 175 Q80 140 160 138 Q240 140 280 175 L280 200 Z" fill="#0f172a" stroke="rgba(0,255,163,0.15)" stroke-width="1"/>
  <path d="M100 200 L100 168 Q130 152 160 150 Q190 152 220 168 L220 200" fill="#1e293b" opacity="0.9"/>
  <!-- cuello -->
  <path d="M142 118 L142 148 Q160 156 178 148 L178 118" fill="url(#p1-skin)"/>
  <!-- orejas -->
  <ellipse cx="128" cy="88" rx="7" ry="11" fill="#b8895c"/>
  <ellipse cx="192" cy="88" rx="7" ry="11" fill="#b8895c"/>
  <!-- cara -->
  <ellipse cx="160" cy="82" rx="38" ry="44" fill="url(#p1-skin)"/>
  <!-- pelo corto -->
  <path d="M122 78 Q118 45 160 38 Q202 45 198 78 Q200 62 195 52 Q160 32 125 52 Q120 62 122 78 Z" fill="#0c0a12"/>
  <path d="M122 70 Q125 55 160 48 Q195 55 198 70" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- cejas -->
  <path d="M132 72 Q142 68 150 70" stroke="#3d2f24" stroke-width="2" stroke-linecap="round"/>
  <path d="M170 70 Q178 68 188 72" stroke="#3d2f24" stroke-width="2" stroke-linecap="round"/>
  <!-- ojos -->
  <ellipse cx="142" cy="82" rx="9" ry="5" fill="#0f172a"/>
  <ellipse cx="178" cy="82" rx="9" ry="5" fill="#0f172a"/>
  <circle cx="144" cy="81" r="3" fill="#e2e8f0"/>
  <circle cx="180" cy="81" r="3" fill="#e2e8f0"/>
  <circle cx="145" cy="80" r="1.2" fill="#0b0f19"/>
  <circle cx="181" cy="80" r="1.2" fill="#0b0f19"/>
  <circle cx="146" cy="79" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="182" cy="79" r="0.8" fill="#fff" opacity="0.7"/>
  <!-- brillo ojos -->
  <ellipse cx="142" cy="82" rx="10" ry="6" stroke="#00ffa3" stroke-opacity="0.35" stroke-width="0.8" fill="none" filter="url(#p1-glow)"/>
  <ellipse cx="178" cy="82" rx="10" ry="6" stroke="#00ffa3" stroke-opacity="0.35" stroke-width="0.8" fill="none"/>
  <!-- nariz -->
  <path d="M160 88 Q156 98 160 102 Q164 98 160 88" fill="none" stroke="#9a7348" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- boca -->
  <path d="M148 108 Q160 114 172 108" stroke="#8b6540" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- barba sombra ligera -->
  <ellipse cx="160" cy="112" rx="22" ry="10" fill="#a67c52" opacity="0.12"/>
</svg>
